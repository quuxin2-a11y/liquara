name: Apply update zip
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the update into the site
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "No zip to apply"; exit 0; fi
          for z in "${zips[@]}"; do
            unzip -o -j "$z" -x '.github/*' '*/.github/*' -d .
            git rm -q --cached "$z" || true
            rm -f "$z"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply update from zip" || { echo "Nothing changed"; exit 0; }
          git push
      - name: Rebuild the website and the Android app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            n=$(basename "$f")
            [ "$n" = "apply-update.yml" ] && continue
            if grep -q "workflow_dispatch" "$f"; then gh workflow run "$n" --ref main && echo "Started $n" || echo "Could not start $n"; fi
          done
