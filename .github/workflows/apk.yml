name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build standalone Android app
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          mkdir -p app/www
          cp app.html manifest.webmanifest sw.js boot.js config.js license-pub.js i18n.js app.css app.js engine.js qa.js demo.js jszip.min.js pdf-lib.min.js logo.svg *.png app/www/
          cp app.html app/www/index.html
          cd app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/haptics@6 @capacitor/app@6 @capacitor/local-notifications@6
          echo '{"appId":"com.liquara.app","appName":"Liquara","webDir":"www","android":{"backgroundColor":"#070b16"}}' > capacitor.config.json
          npx cap add android
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
          grep -q 'allowBackup="false"' android/app/src/main/AndroidManifest.xml || sed -i 's/<application/<application android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
          RES=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp ../icon-512.png $RES/mipmap-$d/ic_launcher.png
            cp ../icon-512.png $RES/mipmap-$d/ic_launcher_round.png
            cp ../icon-fg-432.png $RES/mipmap-$d/ic_launcher_foreground.png
            cp ../icon-bg-432.png $RES/mipmap-$d/ic_launcher_background.png
          done
          mkdir -p $RES/mipmap-anydpi-v26
          for n in ic_launcher ic_launcher_round; do
            printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n  <background android:drawable="@mipmap/ic_launcher_background"/>\n  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n' > $RES/mipmap-anydpi-v26/$n.xml
          done
          npx cap sync android
          cd android
          chmod +x gradlew
          sed -i "s/versionCode 1$/versionCode $GITHUB_RUN_NUMBER/; s/versionName \"1.0\"/versionName \"1.0.$GITHUB_RUN_NUMBER\"/" app/build.gradle
          ROOT=$GITHUB_WORKSPACE
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::warning::No SIGNING_PASSWORD secret found, so this is a test (debug) build."
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk $ROOT/liquara.apk
            echo "Test build (debug key). Add the SIGNING_PASSWORD secret for a signed release." > $ROOT/notes.md
          else
            ./gradlew assembleRelease
            KS=$RUNNER_TEMP/release.jks
            mkdir -p $ROOT/signing
            if [ -f $ROOT/signing/release.jks.enc ]; then
              openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in $ROOT/signing/release.jks.enc -out $KS -pass env:SIGNING_PASSWORD || { echo "::error::Could not unlock the signing key. Check the SIGNING_PASSWORD secret."; exit 1; }
            else
              keytool -genkeypair -keystore $KS -storetype PKCS12 -alias liquara -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Mark Joseph, O=Liquara, L=Austin, ST=Texas, C=US" -storepass:env SIGNING_PASSWORD -keypass:env SIGNING_PASSWORD -noprompt
              openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in $KS -out $ROOT/signing/release.jks.enc -pass env:SIGNING_PASSWORD
              NEWKEY=1
            fi
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            $BT/zipalign -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk $RUNNER_TEMP/aligned.apk
            $BT/apksigner sign --ks $KS --ks-key-alias liquara --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_PASSWORD --out $ROOT/liquara.apk $RUNNER_TEMP/aligned.apk
            rm -f $KS
            FP=$($BT/apksigner verify --print-certs $ROOT/liquara.apk | grep -m1 "SHA-256 digest" | sed 's/.*: //')
            printf "Signed with the Liquara release key.\n\nCertificate SHA-256 fingerprint:\n\n\`%s\`\n\nAPK SHA-256 checksum is in liquara.apk.sha256.\n" "$FP" > $ROOT/notes.md
            if [ "$NEWKEY" = "1" ]; then
              cd $ROOT
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add signing/release.jks.enc
              git commit -m "Add encrypted release signing key"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
          cd $ROOT
          sha256sum liquara.apk > liquara.apk.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Liquara APK
          body_path: notes.md
          files: |
            liquara.apk
            liquara.apk.sha256
