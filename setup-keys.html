<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liquara · license keys</title><meta name="robots" content="noindex">
<style>body{font-family:system-ui,sans-serif;background:#070b16;color:#f2f5ff;max-width:680px;margin:0 auto;padding:24px}textarea{width:100%;height:120px;background:#111a2e;color:#c8ff4d;border:1px solid #1f2a44;border-radius:12px;padding:10px;font:12px monospace}button{background:#c8ff4d;color:#0b1226;border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:16px}p{color:#a3afc9}</style></head>
<body><h1>License keys</h1><p>Makes the key pair Liquara uses to sign license codes. It runs only in this browser; nothing is sent anywhere. Do this once.</p><button id="go">Make my keys</button>
<h3>1. Private key → Cloudflare helper secret named LICENSE_KEY (keep it secret)</h3><textarea id="priv" readonly></textarea>
<h3>2. Public line → replace the line in license-pub.js</h3><textarea id="pub" readonly></textarea>
<script>
document.getElementById("go").onclick=async function(){var k=await crypto.subtle.generateKey({name:"ECDSA",namedCurve:"P-256"},true,["sign","verify"]);var pr=await crypto.subtle.exportKey("jwk",k.privateKey),pu=await crypto.subtle.exportKey("jwk",k.publicKey);delete pu.key_ops;delete pu.ext;document.getElementById("priv").value=JSON.stringify(pr);document.getElementById("pub").value="window.LQ_LICENSE_PUB = "+JSON.stringify(pu)+";";};
</script></body></html>
